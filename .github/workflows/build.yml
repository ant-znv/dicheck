name: build-release

# Сборка артефактов: push в main, pull_request в main и workflow_dispatch;
# релиз GitHub Releases — только на тегах vX.Y.Z.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # на тегах ловим забытый bump версии сразу: иначе updater вечно
      # предлагал бы «обновление» на ту же версию
      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from backend.app.version import APP_VERSION
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          assert APP_VERSION == expected, (
              f"APP_VERSION={APP_VERSION} не совпадает с тегом {tag}: "
              "поднимите версию в backend/app/version.py и перевесьте тег"
          )
          print(f"version ok: {APP_VERSION} == {tag}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # фронтенд собирается ДО PyInstaller — frontend/dist вшивается в exe
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run tests
        run: python -X utf8 -m pytest backend/tests -q

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean DI_Check.spec

      - name: Pack portable zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/DI_Check/README.md
          Compress-Archive -Path 'dist/DI_Check/*' -DestinationPath 'DI_Check_portable.zip' -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe не найден (Inno Setup 6/7)"
            exit 1
          }
          Write-Host "ISCC: $iscc"
          & $iscc /DMyAppVersion=$env:VERSION DI_Check.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DI_Check-windows
          if-no-files-found: error
          path: |
            DI_Check_portable.zip
            dist/installer/DI_Check_setup.exe

      # идемпотентно: на повторном прогоне релиз уже существует — создаём
      # только если его нет, ассеты перезаливаем с --clobber
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/installer/DI_Check_setup.exe \
            DI_Check_portable.zip \
            --clobber
